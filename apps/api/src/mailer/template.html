<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paperplane 이메일 인증 코드</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #eef5f7;
      color: #17324d;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      border="0"
      style="background-color: #eef5f7"
    >
      <tr>
        <td align="center" style="padding: 42px 16px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            border="0"
            style="
              max-width: 560px;
              background-color: #ffffff;
              border: 1px solid #d7e5e8;
              border-radius: 18px;
              overflow: hidden;
            "
          >
            <tr>
              <td
                style="
                  height: 8px;
                  background-color: #4db6ac;
                  font-size: 0;
                  line-height: 0;
                "
              >
                &nbsp;
              </td>
            </tr>
            <tr>
              <td style="padding: 34px 42px 12px">
                <table
                  role="presentation"
                  width="100%"
                  cellspacing="0"
                  cellpadding="0"
                  border="0"
                >
                  <tr>
                    <td
                      style="
                        font-size: 22px;
                        font-weight: 700;
                        letter-spacing: 0.2px;
                        color: #17324d;
                      "
                    >
                      Paperplane
                    </td>
                    <td align="right" style="font-size: 22px; color: #4db6ac">
                      &#9993;
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 28px 42px 42px">
                <p
                  style="
                    margin: 0 0 12px;
                    font-size: 13px;
                    font-weight: 700;
                    letter-spacing: 1.6px;
                    text-transform: uppercase;
                    color: #4db6ac;
                  "
                >
                  이메일 인증
                </p>
                <h1
                  style="
                    margin: 0 0 16px;
                    font-size: 32px;
                    line-height: 1.2;
                    color: #17324d;
                  "
                >
                  인증 코드가 도착했습니다.
                </h1>

                <table
                  role="presentation"
                  width="100%"
                  cellspacing="0"
                  cellpadding="0"
                  border="0"
                  style="margin: 30px 0 24px"
                >
                  <tr>
                    <td
                      align="center"
                      style="
                        padding: 24px 16px;
                        background-color: #e7f5f3;
                        border: 1px solid #bfe2dc;
                        border-radius: 12px;
                      "
                    >
                      <p
                        style="
                          margin: 0 0 8px;
                          font-size: 11px;
                          font-weight: 700;
                          letter-spacing: 2px;
                          text-transform: uppercase;
                          color: #4a817b;
                        "
                      >
                        인증 코드
                      </p>
                      <p
                        style="
                          margin: 0;
                          font-size: 36px;
                          line-height: 1;
                          font-weight: 700;
                          letter-spacing: 9px;
                          color: #17324d;
                        "
                      >
                        {{verifyCode}}
                      </p>
                    </td>
                  </tr>
                </table>

                <p
                  style="
                    margin: 0 0 8px;
                    font-size: 14px;
                    line-height: 1.6;
                    color: #587080;
                  "
                >
                  이 인증 코드는 잠시 후 만료됩니다. 보안을 위해 누구에게도
                  공유하지 마세요.
                </p>
                <p
                  style="
                    margin: 0;
                    font-size: 14px;
                    line-height: 1.6;
                    color: #587080;
                  "
                >
                  본인이 요청하지 않은 이메일이라면 이 메일을 안전하게 무시해
                  주세요.
                </p>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 22px 42px;
                  background-color: #f7faf9;
                  border-top: 1px solid #e3eded;
                "
              >
                <p
                  style="
                    margin: 0;
                    font-size: 12px;
                    line-height: 1.6;
                    color: #82949c;
                  "
                >
                  Paperplane에서 자동으로 발송한 메일입니다. 이 메일에는
                  회신하지 마세요.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
