# 컨테이너와 볼륨을 묶는 Compose 프로젝트 이름입니다.
name: paperplane-mail

services:
  opendkim:
    build:
      context: .
      dockerfile: Dockerfile.opendkim
    image: paperplane/opendkim:local
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./dkim/mail202610.private
        target: /run/secrets/dkim.private
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /run/opendkim
    networks: [signing]
    healthcheck:
      test: [CMD, nc, -z, -w, '2', 127.0.0.1, '8891']
      interval: 10s
      timeout: 3s
      retries: 5

  postfix:
    # 현재 폴더의 Dockerfile로 Postfix 이미지를 빌드합니다.
    image: paperplane/postfix:local
    build:
      context: .
    # 사용자가 직접 중지한 경우를 제외하고 자동 재시작합니다.
    restart: unless-stopped
    depends_on:
      opendkim: {condition: service_healthy}
    hostname: ${POSTFIX_HOSTNAME:-mail.paperplane.example}
    # ${변수:-기본값}은 .env 값이 없거나 비어 있으면 기본값을 사용합니다.
    environment:
      # SMTP 인사말 등에 사용하는 메일 서버의 호스트명입니다.
      POSTFIX_HOSTNAME: ${POSTFIX_HOSTNAME:-mail.paperplane.example}
      # apps/database의 읽기 전용 계정으로 도메인/수신 주소를 조회합니다.
      POSTFIX_DB_HOST: ${POSTFIX_DB_HOST:-postgres}
      POSTFIX_DB_PORT: ${POSTFIX_DB_PORT:-5432}
      POSTFIX_DB_NAME: ${POSTFIX_DB_NAME:-paperplane}
      POSTFIX_DB_USER: ${POSTFIX_DB_USER:-paperplane_postfix}
      POSTFIX_DB_PASSWORD: ${POSTFIX_DB_PASSWORD:?DB 조회 계정 비밀번호를 .env에 입력하세요}
      # 재주입 포트로 전달을 요청할 수 있는 신뢰 IP/CIDR입니다.
      POSTFIX_TRUSTED_NETWORKS: ${POSTFIX_TRUSTED_NETWORKS:-127.0.0.0/8,172.30.25.0/24}
      # 수신 메일을 검사하고 API로 전달 대상을 조회하는 apps/smtp의 주소입니다.
      FILTER_SMTP_HOST: ${FILTER_SMTP_HOST:-host.docker.internal}
      FILTER_SMTP_PORT: ${FILTER_SMTP_PORT:-10025}
      # 첨부파일을 포함한 메일 전체 크기 제한입니다. 기본값은 25 MiB입니다.
      POSTFIX_MESSAGE_SIZE_LIMIT: ${POSTFIX_MESSAGE_SIZE_LIMIT:-26214400}
    ports:
      # 호스트 IP:호스트 포트:컨테이너 포트 순서입니다.
      # 로컬 개발은 127.0.0.1:2525, 외부 MX 수신은 바인딩 주소와 포트 25 설정이 필요합니다.
      - '${SMTP_BIND_ADDRESS:-127.0.0.1}:${SMTP_PUBLIC_PORT:-2525}:25'
      # SMTP 앱이 처리한 메일을 다시 받아 외부 목적지로 전송하는 전용 포트입니다.
      # 호스트의 SMTP 앱 포트 10025와 충돌하지 않도록 10026을 사용합니다.
      # 호스트에서는 로컬 접속만 허용하며 컨테이너 간 접속은 신뢰 네트워크로 제한합니다.
      - '127.0.0.1:${SMTP_REINJECT_PORT:-10026}:10025'
      # 호스트 API에서 사용하는 자체 발신 서명 포트입니다.
      - '127.0.0.1:10027:10027'
    # 컨테이너에서 호스트의 SMTP 앱에 접근할 수 있도록 이름을 등록합니다.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      # 전송 대기 메일과 Postfix 상태를 컨테이너 재생성 후에도 유지합니다.
      - postfix-queue:/var/spool/postfix
      - postfix-data:/var/lib/postfix
      # TLS 인증서와 개인키는 읽기 전용으로 전달합니다.
      - ./certs:/etc/postfix/tls:ro
    networks:
      - mail
      - database
      - signing
    # Postfix 프로세스와 수신/전달/서명 세 포트가 열려 있는지 검사합니다.
    # 실제 SMTP 앱, API, 외부 목적지까지의 전달 성공을 검사하지는 않습니다.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'postfix status && nc -z -w 2 127.0.0.1 25 && nc -z -w 2 127.0.0.1 10025 && nc -z -w 2 127.0.0.1 10027',
        ]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    # 정상 종료 대기 시간과 로그 파일 보관 한도를 지정합니다.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  # Milter 포트는 Postfix만 접근하며 호스트에는 공개하지 않습니다.
  signing:
    internal: true
  # apps/database를 먼저 실행하여 생성합니다. 메일 재주입 신뢰망과 분리합니다.
  database:
    external: true
    name: paperplane-database
  # 신뢰할 수 있는 메일 관련 서비스만 연결하는 네트워크입니다.
  mail:
    name: paperplane-mail
    driver: bridge
    ipam:
      config:
        # 변경 시 POSTFIX_TRUSTED_NETWORKS의 CIDR도 함께 맞춰야 합니다.
        - subnet: ${MAIL_NETWORK_SUBNET:-172.30.25.0/24}

volumes:
  # down은 보존하지만 down -v는 전송 대기 메일까지 삭제하므로 주의하세요.
  postfix-queue:
  postfix-data:
