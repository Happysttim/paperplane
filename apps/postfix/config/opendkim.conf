# Paperplane 자체 발신 메일만 서명합니다. 수신 검증/ARC는 별도 기능입니다.
Mode                    s
Domain                  paperplane.life
SubDomains              no
Selector                mail202610
KeyFile                 /run/opendkim/mail202610.private
Canonicalization        relaxed/relaxed
SignatureAlgorithm      rsa-sha256
OversignHeaders         From
RequireSafeKeys         yes
UserID                  opendkim
UMask                   0077
PidFile                 /run/opendkim/opendkim.pid
Socket                  inet:8891@0.0.0.0
# 서명 전용 리스너의 매크로가 있는 요청만 내부 발신으로 취급합니다.
MTA                     ORIGINATING
Syslog                  no
